<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFD9EA" />
<title>a little garden for Madam Ji 🌷</title>
<meta name="description" content="no reel today. tap to open 🌱" />
<meta property="og:title" content="a little garden for Madam Ji 🌷" />
<meta property="og:description" content="no reel today. tap to open 🌱" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet" />
<style>
:root{
  --blush:#FFF6F8; --straw:#FFC8DD; --rose:#FF6F91; --lav:#CDB4DB; --mint:#A8D8B9; --butter:#FFE3A3; --cocoa:#6B4A57;
  --jelly:cubic-bezier(.34,1.56,.64,1);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{
  background:#FFE1EC radial-gradient(circle at 20px 20px,rgba(255,111,145,.13) 3px,transparent 4px) 0 0/40px 40px;
  font-family:'Fredoka',ui-rounded,system-ui,-apple-system,sans-serif;color:var(--cocoa);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.probe{position:absolute;visibility:hidden;pointer-events:none;width:1px}

/* ---------- the phone-shaped stage ---------- */
#app{
  position:fixed;inset:0;margin:0 auto;width:100%;max-width:500px;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,#E4DAFF 0%,#FFD9EA 36%,#FFE8EE 60%,#FFF3EE 100%);
}
@media (min-width:640px) and (min-height:700px){
  #app{top:20px;bottom:20px;max-width:430px;border-radius:38px;
    box-shadow:0 0 0 10px #fff,0 0 0 13px var(--cocoa),0 30px 80px rgba(107,74,87,.3)}
}

/* ---------- sky ---------- */
.sky{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.track{position:absolute;left:0;width:100%;animation:drift linear infinite}
.track .cloud{width:30%;max-width:150px;animation:bob 5s ease-in-out infinite alternate}
.cloud svg{width:100%;display:block}
.t1{top:15%;animation-duration:70s;animation-delay:-22s}
.t2{top:29%;animation-duration:95s;animation-delay:-70s}
.t2 .cloud{width:24%;animation-duration:6s}
.t3{top:40%;animation-duration:120s;animation-delay:-35s}
.t3 .cloud{width:17%;opacity:.75}
@keyframes drift{from{transform:translateX(-35%)}to{transform:translateX(105%)}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
.rainbow{position:absolute;left:-6%;width:112%;bottom:36%;opacity:0;transform:translateY(20px) scale(.9);transform-origin:50% 100%;transition:opacity 1.4s ease,transform 1.4s var(--jelly)}
.rainbow.show{opacity:.85;transform:none}

#hills{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#garden{position:absolute;inset:0;z-index:3;pointer-events:none}
.fxlayer{position:absolute;inset:0;z-index:4;pointer-events:none}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;z-index:8;pointer-events:none}

/* ---------- flowers ---------- */
.flower{position:absolute;left:0;top:0;pointer-events:none;transform-origin:50% 96.154%}
.flower .sq,.flower .sw{width:100%;height:100%;transform-origin:50% 96.154%}
.flower .sw{animation:sway var(--sp,3s) ease-in-out var(--sdl,0s) infinite alternate}
.flower svg{width:100%;height:100%;display:block;overflow:visible}
.flower .hit{pointer-events:all;cursor:pointer}
.stem{fill:none;stroke-linecap:round}
.petal,.pop,.leaf,.bud{transform-box:fill-box;transform:scale(0)}
.petal{transform-origin:50% 100%}
.pop,.bud{transform-origin:50% 50%}
.leaf{transform-origin:0% 100%}
.go .stem{animation:draw .8s cubic-bezier(.35,.1,.25,1) forwards}
.go .leaf{animation:popIn .5s var(--jelly) var(--d) forwards}
.go .bud{animation:popIn .35s var(--jelly) .64s forwards}
.go .petal{animation:popIn .6s var(--jelly) calc(var(--d) + 850ms) forwards}
.go .pop{animation:popIn .5s var(--jelly) calc(var(--d) + 850ms) forwards}
.hb{transform-box:fill-box;transform-origin:50% 50%}
.bloomed .hb{animation:nod 3.2s ease-in-out infinite}
.bloomed .twinkle{animation:twinkle 1.8s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.4s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.55) rotate(45deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

.seed{position:absolute;left:0;top:0;width:10px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 30%,#F6D3C1,#C98B6B 70%);box-shadow:0 0 0 2px var(--cocoa)}
.can{position:absolute}
.can svg{width:100%;display:block;overflow:visible}
.drop{position:absolute;width:6px;height:9px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:#9ED8F5;box-shadow:0 0 0 1.5px var(--cocoa)}

/* bouquet wrap */
.wrap{position:absolute;left:0;top:0;opacity:0;transform:scale(0);transform-origin:50% 96%}
.wrap svg{width:100%;height:100%;display:block;overflow:visible}
.wrap-back{z-index:5}
.wrap-front{z-index:60}
.wrap.show{animation:wrapIn .7s var(--jelly) forwards}
.bow{transform-box:fill-box;transform-origin:50% 40%;transform:scale(0) rotate(-30deg);transition:transform .6s var(--jelly)}
.tie .bow{transform:none}
@keyframes wrapIn{from{opacity:0;transform:scale(0) rotate(-8deg)}to{opacity:1;transform:none}}

/* ---------- kitty ---------- */
.kitty{position:absolute;left:0;top:0;z-index:6;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .25s}
.kitty.on{opacity:1}
.kitty-in{width:100%;height:100%;transform-origin:50% 100%}
.kitty svg,.peek svg{width:100%;height:100%;display:block;overflow:visible}
.k-head{transform-box:fill-box;transform-origin:50% 85%;animation:tilt 6s ease-in-out infinite}
.k-tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 2.2s ease-in-out infinite alternate}
.k-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
.k-happy{opacity:0}
.k-blush{transform-box:fill-box;transform-origin:50% 50%;transition:opacity .3s,transform .3s}
.kitty.happy .k-eyes{opacity:0}
.kitty.happy .k-happy{opacity:1}
.kitty.happy .k-blush{opacity:1;transform:scale(1.25)}
.k-gift{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .6s var(--jelly)}
.kitty.gift .k-gift{transform:scale(1)}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(3deg)}}
@keyframes tail{from{transform:rotate(-8deg)}to{transform:rotate(12deg)}}

/* ---------- bee ---------- */
.bee{position:absolute;left:0;top:0;z-index:7;width:56px;height:56px;padding:8px;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .8s}
.bee.on{opacity:1}
.bee-in{width:100%;height:100%;transition:transform .25s}
.bee.left .bee-in{transform:scaleX(-1)}
.bee svg{width:100%;height:100%;display:block;overflow:visible}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .11s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.45)}}

/* ---------- rain cloud ---------- */
.raincloud{position:absolute;z-index:9;left:17%;width:66%;top:22%;pointer-events:none;opacity:0;transform:translateY(-30px) scale(.8);transition:opacity .5s,transform .6s var(--jelly)}
.raincloud.show{opacity:1;transform:none}
.raincloud svg{width:100%;display:block;overflow:visible}

/* ---------- tap hint ---------- */
.tap-hint{position:absolute;left:0;top:0;z-index:5;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .4s}
.tap-hint.show{opacity:1}
.tap-hint::before,.tap-hint::after{content:'';position:absolute;left:-28px;top:-15px;width:56px;height:30px;border-radius:50%;border:3px solid #fff;animation:ripple 1.6s ease-out infinite}
.tap-hint::after{animation-delay:.8s}
.tap-hint span{position:absolute;left:-13px;top:2px;font-size:30px;line-height:1;animation:finger 1.6s ease-in-out infinite}
@keyframes ripple{from{transform:scale(.3);opacity:1}to{transform:scale(1.7);opacity:0}}
@keyframes finger{0%,100%{transform:translateY(4px)}45%{transform:translateY(-10px)}}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;z-index:10;padding:calc(var(--st) + 10px) 12px 0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.row{display:flex;align-items:center;width:100%;gap:6px}
.title{flex:1;text-align:center;font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(22px,7vw,31px);line-height:1.25;color:var(--rose);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,0 5px 12px rgba(255,111,145,.3);transition:opacity .5s,transform .5s}
.sound{width:44px;height:44px;flex:none;position:relative;border-radius:50%;background:#fff;border:2.5px solid var(--cocoa);box-shadow:0 3px 0 var(--cocoa);
  display:grid;place-items:center;pointer-events:auto;color:var(--cocoa);margin-top:6px}
.sound::before,.sound::after{content:'';position:absolute;top:-8px;width:14px;height:14px;background:var(--cocoa);clip-path:polygon(50% 0,100% 100%,0 100%);z-index:-1}
.sound::before{left:3px;transform:rotate(-18deg)}
.sound::after{right:3px;transform:rotate(18deg)}
.sound:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cocoa)}
.sound.on{background:#FFE3EC}
.sound.on .slash{display:none}
.sun{width:56px;height:56px;flex:none;pointer-events:auto;cursor:pointer}
.sun svg{width:100%;height:100%;display:block;overflow:visible}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 24s linear infinite}
.s-blush{transform-box:fill-box;transform-origin:50% 50%;transition:opacity .3s,transform .3s}
.sun.shy .s-blush{opacity:1;transform:scale(1.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.counter{display:flex;gap:5px;margin-top:2px;opacity:0;transition:opacity .5s,transform .5s}
.ci{width:22px;height:22px}
.ci svg{width:100%;height:100%;display:block;overflow:visible}
.ci ellipse{fill:#fff;stroke:var(--cocoa);stroke-width:1.7;transition:fill .3s}
.ci.on ellipse{fill:var(--rose)}
.ci.on{animation:popIn .55s var(--jelly)}
.hint{margin-top:8px;padding:2px 14px 4px;border-radius:999px;background:rgba(255,255,255,.7);font-family:'Caveat',cursive;font-weight:700;
  font-size:clamp(20px,5.6vw,24px);line-height:1.15;text-align:center;opacity:0;transition:opacity .25s,transform .35s}
.hud.on .counter,.hud.on .hint{opacity:1}
.hud .hint.swap{opacity:0;transform:translateY(5px)}
.hud.end .title,.hud.end .counter,.hud.end .hint{opacity:0;transform:translateY(-10px)}

/* ---------- speech bubble ---------- */
.bubble{position:absolute;left:var(--bx,0);top:var(--by,0);z-index:12;max-width:min(78%,290px);padding:7px 16px 9px;background:#fff;border:2.5px solid var(--cocoa);border-radius:20px;
  box-shadow:0 5px 0 rgba(107,74,87,.16);font-family:'Caveat',cursive;font-weight:700;font-size:clamp(21px,6vw,25px);line-height:1.08;text-align:center;
  pointer-events:none;opacity:0;transform:scale(.5);transform-origin:var(--tx,50%) 115%;transition:opacity .18s,transform .4s var(--jelly)}
.bubble.below{transform-origin:var(--tx,50%) -15%}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:'';position:absolute;left:calc(var(--tx,50%) - 8px);bottom:-9.5px;width:14px;height:14px;background:#fff;
  border-right:2.5px solid var(--cocoa);border-bottom:2.5px solid var(--cocoa);border-bottom-right-radius:3px;transform:rotate(45deg)}
.bubble.below::after{bottom:auto;top:-9.5px;transform:rotate(225deg)}

/* ---------- buttons ---------- */
.btn{font-weight:600;font-size:18px;padding:12px 24px;border-radius:999px;color:#fff;background:linear-gradient(180deg,#FF93AE,#FF6F91);
  border:3px solid var(--cocoa);box-shadow:0 5px 0 var(--cocoa);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cocoa)}
.btn.alt{background:#fff;color:var(--rose)}

/* ---------- intro ---------- */
.intro{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px 22px;
  background:rgba(255,228,239,.4);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);transition:opacity .45s}
.intro.out{opacity:0;pointer-events:none}
.card{position:relative;width:min(100%,350px);margin-top:92px;background:#fff;border:3px solid var(--cocoa);border-radius:30px;padding:26px 22px 26px;text-align:center;
  box-shadow:0 8px 0 #FFC8DD,0 8px 0 3px var(--cocoa),0 30px 60px rgba(255,111,145,.3);opacity:0}
.ready .card{animation:cardIn .8s var(--jelly) .1s forwards}
.intro.out .card{animation:cardOut .4s ease-in forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
@keyframes cardOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.85) translateY(20px)}}
.peek{position:absolute;left:50%;top:-98px;width:100px;height:103px;margin-left:-50px}
.i-hey{font-family:'Caveat',cursive;font-weight:700;font-size:27px;color:var(--rose);line-height:1}
.i-title{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(26px,8vw,32px);line-height:1.3;margin:6px 0 10px}
.i-body{font-size:16.5px;line-height:1.45;opacity:.9}
.i-small{font-family:'Caveat',cursive;font-weight:600;font-size:21px;opacity:.75;margin-top:6px}
.start{margin-top:18px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.start:active{animation:none}

/* ---------- finale ---------- */
.finale{position:absolute;inset:0;z-index:11;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;
  padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 18px)}
.f-top{display:flex;flex-direction:column;align-items:center;padding:0 50px;gap:1px}
.f-top>*{opacity:0;transform:translateY(14px) scale(.96);transition:opacity .6s ease,transform .7s var(--jelly)}
.finale.show .f-top>*{opacity:1;transform:none}
.finale.show .f-top>:nth-child(2){transition-delay:.15s}
.finale.show .f-top>:nth-child(3){transition-delay:.35s}
.finale.show .f-top>:nth-child(4){transition-delay:.55s}
.f-small{font-family:'Caveat',cursive;font-weight:700;font-size:24px;line-height:1.1;color:var(--rose);margin-top:8px}
.f-title{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(26px,8vw,36px);line-height:1.25;color:var(--rose);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 14px rgba(255,111,145,.3)}
.f-sub{font-size:15.5px;line-height:1.35;max-width:270px;margin-top:4px}
.f-sign{font-family:'Caveat',cursive;font-weight:700;font-size:23px;margin-top:2px}
.f-space{flex:1;width:100%;min-height:60px}
.f-bottom{display:flex;justify-content:center;min-height:34px}
.replay{font-size:14px;font-weight:500;opacity:0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.6);transition:opacity .6s;pointer-events:none}
.finale.replay-on .replay{opacity:.85;pointer-events:auto}

/* ---------- rotate notice ---------- */
.rotate{display:none;position:fixed;inset:0;z-index:30;background:#FFE1EC;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px}
.rotate .phone{font-size:44px;animation:turn 2s ease-in-out infinite}
.rotate p{font-family:'Caveat',cursive;font-weight:700;font-size:30px;color:var(--rose)}
.rotate small{font-size:15px}
@keyframes turn{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:500px){.rotate{display:flex}}

@media (prefers-reduced-motion:reduce){
  .track,.track .cloud,.flower .sw,.bloomed .hb,.k-head,.k-tail,.rays,.start{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="probe-t" class="probe" style="height:env(safe-area-inset-top,0px)"></div>
  <div id="probe-b" class="probe" style="height:env(safe-area-inset-bottom,0px)"></div>

  <!-- sky: rainbow + drifting clouds -->
  <div class="sky" aria-hidden="true">
    <svg class="rainbow" viewBox="0 0 200 100" preserveAspectRatio="xMidYMax meet">
      <g fill="none" stroke-width="10" stroke-linecap="round">
        <path d="M6 100 A94 94 0 0 1 194 100" stroke="#FFB3C7"/>
        <path d="M16 100 A84 84 0 0 1 184 100" stroke="#FFD6A5"/>
        <path d="M26 100 A74 74 0 0 1 174 100" stroke="#FDF0A6"/>
        <path d="M36 100 A64 64 0 0 1 164 100" stroke="#C6F0C8"/>
        <path d="M46 100 A54 54 0 0 1 154 100" stroke="#BFD9FF"/>
        <path d="M56 100 A44 44 0 0 1 144 100" stroke="#DCC9FF"/>
      </g>
    </svg>
    <div class="track t1"><div class="cloud"><svg viewBox="0 0 120 64">
      <path d="M22 56 C6 56 4 36 18 33 C16 16 38 9 48 21 C54 6 80 6 86 22 C102 16 118 31 108 43 C118 54 104 58 96 56 Z" fill="#fff" stroke="rgba(107,74,87,.35)" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M48 38 Q52 42 56 38 M66 38 Q70 42 74 38" fill="none" stroke="#6B4A57" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="45" cy="45" rx="4" ry="2.4" fill="#FFB3C8"/><ellipse cx="77" cy="45" rx="4" ry="2.4" fill="#FFB3C8"/>
      <path d="M58.5 45 Q61 47.5 63.5 45" fill="none" stroke="#6B4A57" stroke-width="1.8" stroke-linecap="round"/>
    </svg></div></div>
    <div class="track t2"><div class="cloud"><svg viewBox="0 0 120 64"><path d="M22 56 C6 56 4 36 18 33 C16 16 38 9 48 21 C54 6 80 6 86 22 C102 16 118 31 108 43 C118 54 104 58 96 56 Z" fill="#fff" stroke="rgba(107,74,87,.3)" stroke-width="2.4" stroke-linejoin="round"/></svg></div></div>
    <div class="track t3"><div class="cloud"><svg viewBox="0 0 120 64"><path d="M22 56 C6 56 4 36 18 33 C16 16 38 9 48 21 C54 6 80 6 86 22 C102 16 118 31 108 43 C118 54 104 58 96 56 Z" fill="#fff" stroke="rgba(107,74,87,.25)" stroke-width="2.4" stroke-linejoin="round"/></svg></div></div>
  </div>

  <svg id="hills" aria-hidden="true"></svg>

  <div id="garden">
    <!-- bouquet wrap (appears at the end) -->
    <div class="wrap wrap-back"><svg viewBox="0 0 100 82">
      <path d="M2 7 Q26 -2 50 4 Q74 -2 98 7 L58 76 Q50 82 42 76 Z" fill="#E4D3F0" stroke="#6B4A57" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M12 9 Q30 4 50 8 Q70 4 88 9 L52 40 Z" fill="#D5BFE6" opacity=".7"/>
    </svg></div>
    <div class="wrap wrap-front"><svg viewBox="0 0 100 82">
      <path d="M6 24 Q20 35 34 28 Q42 37 50 30 Q58 37 66 28 Q80 35 94 24 L57 76 Q50 82 43 76 Z" fill="#FFC8DD" stroke="#6B4A57" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M50 31 L50 74" stroke="rgba(107,74,87,.18)" stroke-width="1.6" stroke-linecap="round"/>
      <g fill="#fff">
        <path transform="translate(28 40) scale(.5)" d="M0 6 C-10 -1 -8 -11 0 -6 C8 -11 10 -1 0 6Z"/>
        <path transform="translate(70 39) scale(.45)" d="M0 6 C-10 -1 -8 -11 0 -6 C8 -11 10 -1 0 6Z"/>
        <path transform="translate(40 55) scale(.4)" d="M0 6 C-10 -1 -8 -11 0 -6 C8 -11 10 -1 0 6Z"/>
        <path transform="translate(62 56) scale(.42)" d="M0 6 C-10 -1 -8 -11 0 -6 C8 -11 10 -1 0 6Z"/>
      </g>
      <g transform="translate(50 57)"><g class="bow">
        <path d="M-2 2 L-11 21 L-5.5 18.5 L-3.5 24 L1 4 Z" fill="#FF6F91" stroke="#6B4A57" stroke-width="2" stroke-linejoin="round"/>
        <path d="M2 2 L11 21 L5.5 18.5 L3.5 24 L-1 4 Z" fill="#FF6F91" stroke="#6B4A57" stroke-width="2" stroke-linejoin="round"/>
        <path d="M0 0 C-6 -13 -23 -11 -19 0 C-23 11 -6 13 0 0 Z" fill="#FF8FAB" stroke="#6B4A57" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M0 0 C6 -13 23 -11 19 0 C23 11 6 13 0 0 Z" fill="#FF8FAB" stroke="#6B4A57" stroke-width="2.2" stroke-linejoin="round"/>
        <circle r="4.6" fill="#FF6F91" stroke="#6B4A57" stroke-width="2.2"/>
      </g></g>
    </svg></div>
  </div>

  <div class="fxlayer"></div>

/* ---------- planted flowers ---------- */
const planted = [];
function makeFlower(idx, x, t) {

  el.className = 'flower';
  el.innerHTML = `<div class="sq"><div class="sw" style="--sp:${rand(2.6, 3.8).toFixed(2)}s;--sdl:-${rand(0, 3).toFixed(2)}s">${svg}</div></div>`;
  garden.appendChild(el);
  const f = { idx, def, el, sq: el.firstChild, hit: el.querySelector('.hit'), color, end, nx: x / W, t };
  f.hit.setAttribute('data-idx', idx);
  el.querySelectorAll('.stem').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });

}
function layoutFlower(f) {

  const h = baseH * (0.8 + 0.28 * f.t), w = h * 120 / 260;

}

}
function findSpot(px, py) {
  let x = clamp(px, W * .1, W * .9);
  const top = plantTop(x), bot = plantBot();
  const t = py < top ? rand(0, .35) : clamp((py - top) / (bot - top), 0, 1);
  const minDx = W * .11;
  const free = nx => planted.every(f => Math.abs(f.nx * W - nx) > minDx || Math.abs(f.t - t) > .45);

}

/* ---------- canvas sparkle / heart / petal effects ---------- */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  const parts = [];
  const PINKS = ['#FF6F91', '#FF8FAB', '#FFC8DD', '#CDB4DB', '#FFB3C8'];
  const GLINT = ['#FFD36E', '#FFFFFF', '#FF8FAB', '#CDB4DB'];

  function resize() { const dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function add(o) {
    if (parts.length > 320) return;
    parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, life: 0, max: 1, size: 8, rot: 0, vr: 0, a: 1, color: '#FF6F91', type: 'heart', wob: 0, wf: 2, ph: Math.random() * 6.28, fade: 'out', amb: false }, o));

      const p = parts[i];
      p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      if (p.type === 'orbit') {
        p.ang += p.va * dt; p.r *= 1 - dt * .9;
        p.x = p.cx + Math.cos(p.ang) * p.r; p.y = p.cy + Math.sin(p.ang) * p.r * .55;
      } else {
        p.vy += p.g * dt;
        if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
        p.x += (p.vx + Math.sin(p.ph + p.life * p.wf) * p.wob) * dt;
        p.y += p.vy * dt;
      }
      p.rot += p.vr * dt;
      if (p.type === 'drop' && p.y > p.stopY) { parts.splice(i, 1); splash(p.x, p.stopY); continue; }
      const u = p.life / p.max;

        case 'dot': ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); break;
        case 'drop': ctx.strokeStyle = p.color; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -p.size); ctx.stroke(); break;
      }

    }
    ctx.globalAlpha = 1;
  }
  function ambient(dt, endMode) {
    const k = reduced ? .3 : 1;

  }
  function tapBurst(x, y) { for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + rand(-1.3, 1.3), v = rand(70, 140); add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 160, drag: 1.5, size: rand(7, 11), color: pick(PINKS), max: rand(.7, 1), vr: rand(-2, 2) }); } }
  function sparkBurst(x, y, n = 10, sc = 1) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = rand(50, 130) * sc; add({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 2.2, size: rand(3, 6) * sc, color: pick(GLINT), max: rand(.6, 1.1), vr: rand(-3, 3) }); } }
  function hearts(x, y, n = 10) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = rand(60, 170); add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, g: 60, drag: 1.6, size: rand(9, 15), color: pick(PINKS), max: rand(1, 1.6), vr: rand(-2, 2) }); } }
  function floatHeart(x, y) { add({ x, y, vy: -60, wob: 18, wf: 3, size: 14, color: '#FF6F91', max: 1.3 }); }
  function petals(x, y, color, n = 4) { for (let i = 0; i < n; i++) add({ type: 'petal', x: x + rand(-10, 10), y: y + rand(-8, 8), vx: rand(-40, 40), vy: rand(-60, -10), g: 90, drag: 1.2, wob: rand(10, 20), size: rand(4.5, 7), color, max: rand(1.4, 2), flip: rand(3, 6), vr: rand(-2, 2) }); }
  function dirt(x, y) { for (let i = 0; i < 8; i++) add({ type: 'dot', x: x + rand(-4, 4), y, vx: rand(-60, 60), vy: -rand(70, 150), g: 520, size: rand(1.6, 3), color: pick(['#D9A48F', '#C98B6B', '#E8BBA6']), max: .55 }); }
  function splash(x, y) { for (let i = 0; i < 3; i++) add({ type: 'dot', x, y, vx: rand(-40, 40), vy: -rand(40, 80), g: 400, size: rand(1.2, 2), color: '#9ED8F5', max: .35 }); }
  function swirl(cx, cy, r, dur) { const n = Math.round(dur / 30); for (let i = 0; i < n; i++) setTimeout(() => add({ type: 'orbit', cx, cy, r: r * rand(.7, 1.05), ang: rand(0, 6.28), va: rand(4, 6), x: cx, y: cy, size: rand(3, 6), color: pick(GLINT), max: rand(.9, 1.4) }), i * 30); }

  }

})();

/* ---------- tiny music box (off until she taps the note) ---------- */
const Sound = (() => {
  let ctx = null, master = null, on = false;
  const N = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = .55;
    const delay = ctx.createDelay(), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
    delay.delayTime.value = .23; fb.gain.value = .28; lp.type = 'lowpass'; lp.frequency.value = 2400;
    master.connect(ctx.destination); master.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(ctx.destination);
  }
  function tone(freq, { t = 0, dur = 1.1, vol = .16, type = 'sine', slide = 0 } = {}) {
    if (!on || !ctx) return;
    const now = ctx.currentTime + t, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, now + dur * .6);
    g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + .012); g.gain.exponentialRampToValueAtTime(.0001, now + dur);
    o.connect(g); g.connect(master); o.start(now); o.stop(now + dur + .05);
  }
  const box = (f, t = 0, v = .14) => { tone(f, { t, vol: v, dur: 1.3 }); tone(f * 2, { t, vol: v * .35, dur: .6 }); tone(f * 3.01, { t, vol: v * .12, dur: .35, type: 'triangle' }); };
  return {
    toggle() { init(); on = !on; if (on && ctx && ctx.state === 'suspended') ctx.resume(); if (on) { box(N[2]); box(N[4], .12); } return on; },
    pop() { tone(520, { dur: .14, vol: .12, slide: 1.8, type: 'triangle' }); },
    pling(i) { box(N[i % N.length]); },
    tink() { box(N[5 + ((Math.random() * 3) | 0)], 0, .07); },
    mrrp() { tone(560, { dur: .32, vol: .1, slide: 1.5, type: 'triangle' }); tone(840, { t: .16, dur: .3, vol: .08, slide: .8, type: 'triangle' }); },
    boop() { tone(390, { dur: .18, vol: .12, slide: 1.4 }); },
    sparkle() { [5, 6, 7].forEach((n, i) => box(N[n], i * .07, .06)); },
    chord() { [0, 2, 4, 5].forEach((n, i) => box(N[n], i * .09, .12)); },
    yay() { [0, 2, 4, 5, 7].forEach((n, i) => box(N[n], i * .08, .13)); },
  };
})();

soundBtn.addEventListener('click', () => { const on = Sound.toggle(); soundBtn.classList.toggle('on', on); soundBtn.setAttribute('aria-pressed', on); });

/* ---------- kitty ---------- */
const HOP = [
  { transform: 'translateY(0) scale(1,1)' }, { transform: 'translateY(0) scale(1.08,.9)', offset: .15 },
  { transform: 'translateY(-22px) scale(.94,1.06)', offset: .45 }, { transform: 'translateY(0) scale(1.06,.94)', offset: .8 }, { transform: 'none' }];

const JIGGLE = [{ transform: 'rotate(0)' }, { transform: 'rotate(-7deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(0)' }];
let kittyMode = 'garden', happyT;
const kittyHop = () => kittyIn.animate(HOP, { duration: 520, easing: 'ease-out' });
function kittyHappy(ms) { kitty.classList.add('happy'); clearTimeout(happyT); happyT = setTimeout(() => kitty.classList.remove('happy'), ms); }
function kittyPos() {
  const kw = clamp(W * .23, 78, 108), kh = kw * 124 / 120;
  if (kittyMode === 'garden' || !layoutB) return { x: W * .03, y: H - SB - kh - H * .012, kw, kh };
  return { x: Math.max(4, layoutB.P.x - layoutB.cw * .34 - kw), y: Math.min(layoutB.tipY + 6, layoutB.bot - 6) - kh, kw, kh };
}
function layoutKitty() { const p = kittyPos(); kitty.pos = p; Object.assign(kitty.style, { left: p.x + 'px', top: p.y + 'px', width: p.kw + 'px', height: p.kh + 'px' }); }
function moveKitty(mode) {

  const dx = a.x - b.x, dy = a.y - b.y;
  kitty.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: `translate(${dx / 2}px,${dy / 2 - 70}px)`, offset: .5 }, { transform: 'translate(0,0)' }], { duration: 750, easing: 'cubic-bezier(.4,0,.3,1)' });
  setTimeout(() => kittyIn.animate(SQUISH, { duration: 380 }), 730);
}

/* ---------- planting ---------- */
let state = 'intro', busy = false;
function tossSeed(a, b) {
  const el = document.createElement('div'); el.className = 'seed'; fxLayer.appendChild(el);
  const apex = Math.min(a.y, b.y) - clamp(Math.abs(b.x - a.x) * .4, 50, 120);
  const cy = 2 * apex - (a.y + b.y) / 2, cx = (a.x + b.x) / 2, kf = [], n = 14;
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = (1 - t) ** 2 * a.x + 2 * (1 - t) * t * cx + t * t * b.x, y = (1 - t) ** 2 * a.y + 2 * (1 - t) * t * cy + t * t * b.y;
    kf.push({ transform: `translate(${x - 5}px,${y - 7}px) rotate(${t * 540}deg)` });
  }
  return el.animate(kf, { duration: 480, fill: 'forwards' }).finished.then(() => {
    const end = kf[n].transform;
    el.animate([{ transform: end + ' scale(1)', opacity: 1 }, { transform: end + ' scale(1.5,.4)', opacity: 0 }], { duration: 260, fill: 'forwards' }).finished.then(() => el.remove());
  });
}
const CAN = `<svg viewBox="0 0 64 48"><path d="M18 17 L4 8 Q1 6 2 10 L16 27 Z" fill="#BDE0FE" stroke="${C}" stroke-width="2.4" stroke-linejoin="round"/><rect x="16" y="14" width="34" height="28" rx="8" fill="#BDE0FE" stroke="${C}" stroke-width="2.6"/><path d="M50 20 Q62 20 60 32 Q58 40 50 38" fill="none" stroke="${C}" stroke-width="2.6" stroke-linecap="round"/><path transform="translate(33 29) scale(.62)" d="M0 6 C-10 -1 -8 -11 0 -6 C8 -11 10 -1 0 6Z" fill="#FF8FAB"/></svg>`;
function water(s) {
  const can = document.createElement('div'); can.className = 'can'; can.innerHTML = CAN; fxLayer.appendChild(can);
  const cw = 54, k = cw / 64, tx = 3 * k, ty = 8 * k, tipY = s.y - 72;
  Object.assign(can.style, { width: cw + 'px', left: (s.x - tx + 2) + 'px', top: (tipY - ty) + 'px', transformOrigin: `${tx}px ${ty}px` });
  can.animate([
    { transform: 'scale(0) rotate(0)', opacity: 0 }, { transform: 'scale(1.1) rotate(0)', opacity: 1, offset: .18 },
    { transform: 'scale(1) rotate(-30deg)', opacity: 1, offset: .35 }, { transform: 'scale(1) rotate(-30deg)', opacity: 1, offset: .8 },
    { transform: 'scale(.6) rotate(0)', opacity: 0 }], { duration: 1150, easing: 'ease-out', fill: 'forwards' }).finished.then(() => can.remove());
  for (let i = 0; i < 3; i++) setTimeout(() => {
    const d = document.createElement('div'); d.className = 'drop';
    d.style.left = (s.x - 1 + (i - 1) * 3) + 'px'; d.style.top = tipY + 'px'; fxLayer.appendChild(d);
    d.animate([{ transform: 'translateY(0) scale(.6)', opacity: 0 }, { transform: 'translateY(10px) scale(1)', opacity: 1, offset: .2 }, { transform: 'translateY(66px) scale(.8)', opacity: .9 }],
      { duration: 420, easing: 'cubic-bezier(.5,0,1,1)', fill: 'forwards' }).finished.then(() => { d.remove(); FX.dirt(s.x, s.y); });
  }, 380 + i * 150);
}
async function plant(px, py) {
  if (state !== 'planting' || busy || planted.length >= 7) return;
  busy = true;
  const idx = planted.length, spot = findSpot(px, py);
  tapHint.classList.remove('show');
  hideBubble();
  Sound.pop(); kittyHop();
  await tossSeed(kittyPaw(), spot);
  FX.dirt(spot.x, spot.y);
  water(spot);
  await wait(380);
  const f = makeFlower(idx, spot.x, spot.t);
  void f.el.offsetWidth;
  f.el.classList.add('go');
  setTimeout(() => Sound.pling(idx), 850);
  await wait(850 + f.end);
  f.bloomed = true; f.el.classList.add('bloomed');
  const h = headOf(f);
  FX.sparkBurst(h.x, h.y, 10);
  setCount(idx + 1);
  showBubble(CONFIG.lines[idx], h.x, h.y - h.r, { dur: idx === 6 ? 3000 : 3800 });
  if (idx === 0) { bee.on = true; bee.el.classList.add('on'); }
  if (idx === 6) { setTimeout(gather, 3100); return; }
  setHint(idx + 1);
  busy = false;
}
function flowerTap(f) {
  if (!f || !f.bloomed || f.flying) return;
  f.sq.animate(SQUISH, { duration: 420, easing: 'ease-out' });
  const h = headOf(f);
  FX.petals(h.x, h.y, f.color, 4);
  Sound.tink();
  showBubble(CONFIG.lines[f.idx], h.x, h.y - h.r, { dur: 2800 });
}

/* ---------- the bouquet finale ---------- */
let layoutB = null;
const SLOT_OF = [2, 5, 1, 4, 0, 6, 3];           // flower index -> fan slot (rose in the middle)
const ANG = [-33, -22, -11, 0, 11, 22, 33];
const LEN = [.84, .93, .98, 1.06, .98, .93, .84];
function computeBouquet() {
  const r = $('.f-space').getBoundingClientRect();
  const top = r.top - AY, bot = r.bottom - AY, avail = Math.max(140, bot - top);
  const fh = Math.min(avail / 1.1, (W - 44) / 1.08, H * .42);
  const extra = Math.max(0, avail - fh * 1.1);      // tall phones: lift the bouquet into the free space
  const P = { x: W / 2, y: bot - fh * .07 - extra * .45 };
  return { fh, P, bot, cw: fh * .62, tipY: P.y + fh * .05 };
}
function bouquetT(f, L) {
  const slot = SLOT_OF[f.idx];
  const ang = ANG[slot] + (f.idx % 2 ? 1.5 : -1.5);
  const s = (L.fh * .82 * LEN[slot]) / (f.def.stem * f.h / 260);
  const dx = L.P.x - f.bx, dy = L.P.y - f.by;
  return { str: `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) rotate(${ang}deg) scale(${s.toFixed(3)})`, ang, s, dx, dy, z: 20 + (3 - Math.abs(slot - 3)) * 3 };
}
function placeWrap(L) {
  const w = L.cw;
  for (const el of [wrapBack, wrapFront]) Object.assign(el.style, { left: (L.P.x - w / 2) + 'px', top: (L.tipY - w * .79) + 'px', width: w + 'px', height: (w * .82) + 'px' });
}
function fly(f, L) {
  const T = bouquetT(f, L);
  const side = f.bx < L.P.x ? -1 : 1;
  const mid = `translate(${(T.dx * .5).toFixed(1)}px,${(T.dy * .5 - L.fh * .55).toFixed(1)}px) rotate(${T.ang * .5 + side * 28}deg) scale(${((1 + T.s) / 2).toFixed(3)})`;
  f.inBouquet = true; f.flying = true; f.trail = 0;
  f.el.style.zIndex = T.z;
  const an = f.el.animate([{ transform: 'none' }, { transform: mid, offset: .5 }, { transform: T.str }], { duration: 1150, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' });
  an.finished.then(() => {
    f.el.style.transform = bouquetT(f, layoutB).str; an.cancel(); f.flying = false;
    f.sq.animate(SQUISH, { duration: 380 });
    const h = headOf(f); FX.sparkBurst(h.x, h.y, 6, .8); Sound.tink();
  });
}
async function gather() {
  state = 'gathering';
  hideBubble();
  setHint(7);
  Sound.sparkle();
  await wait(1500);
  hud.classList.add('end');
  layoutB = computeBouquet();
  const L = layoutB;
  FX.swirl(L.P.x, L.P.y - L.fh * .55, Math.min(W * .42, L.fh * .7), 1500);
  planted.forEach((f, i) => f.sq.animate(JIGGLE, { duration: 460, delay: i * 40, iterations: 2 }));
  await wait(650);
  placeWrap(L);
  wrapBack.classList.add('show'); wrapFront.classList.add('show');
  await wait(300);
  const order = [...planted].sort((a, b) => Math.abs(SLOT_OF[b.idx] - 3) - Math.abs(SLOT_OF[a.idx] - 3));
  order.forEach((f, i) => setTimeout(() => fly(f, L), i * 160));
  await wait(160 * 6 + 1200);
  wrapFront.classList.add('tie');
  Sound.chord();
  FX.sparkBurst(L.P.x, L.P.y - L.fh * .6, 18, 1.6);
  FX.hearts(L.P.x, L.P.y - L.fh * .6, 14);
  finale.classList.add('show');
  moveKitty('bouquet');
  bee.mode = 'bouquet';
  state = 'finale';
  await wait(1700);
  FX.confetti(L.P.x, L.P.y - L.fh * .35);
  Sound.yay();
  kittyHappy(2600); kittyHop(); setTimeout(kittyHop, 480);
  setTimeout(() => finale.classList.add('replay-on'), 2600);
}
function relayoutBouquet() {
  layoutB = computeBouquet();
  placeWrap(layoutB);
  planted.forEach(f => { if (f.inBouquet && !f.flying) f.el.style.transform = bouquetT(f, layoutB).str; });
}
$('.replay').addEventListener('click', () => location.reload());

/* ---------- start ---------- */
$('.start').addEventListener('click', async () => {
  if (state !== 'intro') return;
  intro.classList.add('out');
  await wait(450);
  intro.style.display = 'none';
  state = 'planting';
  hud.classList.add('on');
  placePointer(); tapHint.classList.add('show');
  kitty.classList.add('on');
  kitty.animate([{ transform: 'translate(-130px,0)' }, { transform: 'translate(-85px,-34px)', offset: .3 }, { transform: 'translate(-45px,0)', offset: .55 }, { transform: 'translate(-18px,-18px)', offset: .78 }, { transform: 'none' }], { duration: 900, easing: 'ease-out' });
  setTimeout(() => kittyIn.animate(SQUISH, { duration: 380 }), 880);
});

/* ---------- input ---------- */
app.addEventListener('pointerdown', e => {
  if (e.button > 0 || e.target.closest('button, .intro')) return;
  const x = e.clientX - AX, y = e.clientY - AY, t = e.target;
  if (t.closest('.sun')) return sunTap();
  FX.tapBurst(x, y);
  if (t.closest('.kitty')) return kittyTap();
  if (t.closest('.bee')) return beeTap();
  const hit = t.closest('.hit');
  if (hit) return flowerTap(planted[+hit.getAttribute('data-idx')]);
  if (state === 'planting') plant(x, y);
});
app.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- resize ---------- */
function relayout() {
  measure(); drawHills(); FX.resize();
  planted.forEach(layoutFlower);
  if (layoutB) relayoutBouquet();
  layoutKitty(); placePointer();
}
let rzT;
const onResize = () => { clearTimeout(rzT); rzT = setTimeout(relayout, 120); };
addEventListener('resize', onResize);
addEventListener('orientationchange', onResize);
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

/* ---------- loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  FX.ambient(dt, state === 'finale');
  beeUpdate(dt);
  for (const f of planted) {
    if (!f.flying) continue;
    f.trail -= dt;
    if (f.trail <= 0) { f.trail = .045; const h = headOf(f); FX.add({ type: 'spark', x: h.x + rand(-8, 8), y: h.y + rand(-8, 8), vx: rand(-20, 20), vy: rand(-20, 20), size: rand(2.5, 5), color: pick(['#FFD36E', '#FFFFFF', '#FF8FAB']), max: .7 }); }
  }
  FX.step(dt);
  requestAnimationFrame(loop);
}

relayout();
requestAnimationFrame(loop);
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), wait(1500)]).then(() => document.body.classList.add('ready'));
})();
</script>
